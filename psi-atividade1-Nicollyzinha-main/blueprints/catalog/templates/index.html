{% extends "base.html" %}

{% block conteudo %}
    <h1>Lista de Livros</h1>
    <ul>
        {% for livro in livros %}
            <li>
                {{ livro.titulo }} - {{ livro.autor }} ({{ livro.ano }})
                <a href="{{ url_for('catalog.ver_livro', livro_id=livro.id) }}">Ver Detalhes</a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
